name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          failed = False
          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}")
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Check required web files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .htaccess
          test -f backend/config/config.php
          test -f backend/config/database.php
          test -f backend/database/schema.sql

  deploy:
    name: Deploy to IONOS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy files by rsync over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          set -euo pipefail
          rsync -rlvz --checksum --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/assets/uploads/' \
            --exclude='*.zip' \
            --exclude='/env_IONOS.txt' \
            --exclude='/DEPANNAGE_ERREUR_500.md' \
            --exclude='/README.md' \
            --exclude='/backend/README.md' \
            --exclude='/admin/README.md' \
            --exclude='/backend/tools/' \
            ./ "${SSH_USER}@${SSH_HOST}:httpdocs/"
