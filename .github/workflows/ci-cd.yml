name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          failed = False
          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}")
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Check required web files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .htaccess
          test -f backend/config/config.php
          test -f backend/config/database.php
          test -f backend/database/schema.sql

  deploy:
    name: Deploy to IONOS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production environment file
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          SITE_URL=${{ secrets.PROD_SITE_URL }}
          ADMIN_URL=${{ secrets.PROD_ADMIN_URL }}

          DB_HOST=${{ secrets.PROD_DB_HOST }}
          DB_PORT=${{ secrets.PROD_DB_PORT }}
          DB_NAME=${{ secrets.PROD_DB_NAME }}
          DB_USER=${{ secrets.PROD_DB_USER }}
          DB_PASS=${{ secrets.PROD_DB_PASS }}
          DB_CHARSET=utf8mb4

          ENVIRONMENT=production
          DEBUG_MODE=false
          APP_TIMEZONE=Europe/Paris

          PASSWORD_SALT=${{ secrets.PROD_PASSWORD_SALT }}
          SESSION_LIFETIME=7200

          UPLOAD_URL=${{ secrets.PROD_UPLOAD_URL }}
          MAX_UPLOAD_SIZE=5242880
          ALLOWED_EXTENSIONS=jpg,jpeg,png,gif,webp,avif,pdf
          EOF

      - name: Upload files by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .env.*
            .env.example
            env_IONOS.txt
            DEPANNAGE_ERREUR_500.md
            README.md
            backend/README.md
            admin/README.md
